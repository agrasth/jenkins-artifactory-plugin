name: Release

# Ported from JFrog Pipelines (EOL): release/pipelines.release.yml, pipeline "release_jenkins".
on:
  workflow_dispatch:
    inputs:
      next_version:
        description: "Version to release (e.g. 3.20.0)"
        required: true
      next_development_version:
        description: "Next development version (e.g. 3.20.x-SNAPSHOT)"
        required: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CI: true
      JFROG_BUILD_STATUS: PASS
      JFROG_CLI_BUILD_NAME: ecosystem-artifactory-jenkins-plugin-release
      JFROG_CLI_BUILD_NUMBER: ${{ github.run_number }}
      JFROG_CLI_BUILD_PROJECT: ecosys
      NEXT_VERSION: ${{ github.event.inputs.next_version }}
      NEXT_DEVELOPMENT_VERSION: ${{ github.event.inputs.next_development_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "zulu"

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4

      # Configures git/SSH access to the jenkinsci/artifactory-plugin upstream, verifies
      # version inputs, and runs the JFrog CLI release, publish, distribute and push steps.
      # See .github/scripts/release.sh - it is also runnable standalone on a developer
      # machine (export the same env vars, then run the script).
      - name: Run release
        env:
          JENKINS_ID_RSA: ${{ secrets.JENKINS_ID_RSA }}
          IL_AUTOMATION_TOKEN: ${{ secrets.IL_AUTOMATION_TOKEN }}
          ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
          ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER }}
          ARTIFACTORY_APIKEY: ${{ secrets.ARTIFACTORY_APIKEY }}
          JENKINS_ARTIFACTORY_URL: ${{ secrets.JENKINS_ARTIFACTORY_URL }}
          JENKINS_ARTIFACTORY_USER: ${{ secrets.JENKINS_ARTIFACTORY_USER }}
          JENKINS_ARTIFACTORY_PASSWORD: ${{ secrets.JENKINS_ARTIFACTORY_PASSWORD }}
        run: .github/scripts/release.sh

      # Approximation of JFrog Pipelines' save_tests (which surfaced results in a "Tests" tab).
      # GitHub Actions has no built-in equivalent; upload the raw reports as a build artifact.
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
