name: Snapshot

# Ported from JFrog Pipelines (EOL): release/pipelines.snapshot.yml,
# pipeline "create_artifactory_jenkins_plugin_snapshot".
# The original pipeline's jenkinsSnapshotGit GitRepo resource tracked branch "master"
# (release/pipelines.resources.yml), so this triggers on push to master.
on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      CI: true
      JFROG_BUILD_STATUS: PASS
      JFROG_CLI_BUILD_NAME: ecosystem-artifactory-jenkins-plugin-dev
      JFROG_CLI_BUILD_NUMBER: ${{ github.run_number }}
      JFROG_CLI_BUILD_PROJECT: ecosys
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "zulu"

      # Replaces onStart: restore_cache_files / onComplete: add_cache_files from the
      # original pipeline (actions/cache handles both restore and save in one step).
      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4

      # Configures the JFrog CLI, runs an audit, cleans up former snapshots, and runs the
      # install, publish and distribute steps. See .github/scripts/snapshot.sh - it is also
      # runnable standalone on a developer machine (export the same env vars, then run the
      # script).
      - name: Run snapshot
        env:
          ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
          ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER }}
          ARTIFACTORY_APIKEY: ${{ secrets.ARTIFACTORY_APIKEY }}
        run: .github/scripts/snapshot.sh

      # Approximation of JFrog Pipelines' save_tests (which surfaced results in a "Tests" tab).
      # GitHub Actions has no built-in equivalent; upload the raw reports as a build artifact.
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
